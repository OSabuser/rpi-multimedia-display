# renderer.toml — конфигурация DispmanX-рендерера
#
# Все координаты в пикселях, дисплей 1080×1920.
# Размеры PNG берутся из файла при загрузке — здесь не задаются.
# Раскладка z-слоёв:
#   Z=2  BACKGROUND  (BACK.png, полный экран)
#   Z=3  MODE        (mode-иконка, полный экран, или скрыт)
#   Z=4  WEIGHT      (load_N.png, ~427×106) — ожидает PNG от дизайнера
#   Z=4  DIGIT_LEFT  (font renderer CalSans260) — fast_update
#   Z=4  DIGIT_RIGHT (reserved, не используется) — см. renderer_show_digit
#   Z=4  ARROW       (arrows/*.png, ~338×376) — fast_update, ожидает PNG
#   Z=5  NOTIFICATION (1080×270px)
# Экран 1080×1920:
#     ┌──────────────────┐ y=0
#     │                  │
#     │  [layout F2]     │  ← DIGIT/ARROW/WEIGHT: финал после ассетов
#     │                  │
#     ├──────────────────┤ y=1650 ← SPRITE_NOTIFICATION начинается здесь
#     │   NOTIFICATION   │        (PNG 1080×270px)
#     └──────────────────┘ y=1920

[renderer]
resources_dir = /data/resources

[slot.digit_left]
x = 485
y = 200

[slot.digit_right]
x = 0
y = 0

[slot.arrow]
x = 875
y = 181

[slot.weight]
x = 333
y = 27

[slot.notification]
x = 0
y = 1650
